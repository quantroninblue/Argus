# TurtleBot4 class: round differential base, 360 degree scanner inside the shell, forward
# stereo depth camera. Dimensions and limits approximate, from the public specification.
argus_profile: 1
id: ref-turtlebot4-class
name: TurtleBot4 class

geometry:
  ground_z_m: 0.0
  shapes:
    - type: cylinder
      radius_m: 0.171
      length_m: 0.34
      pose: {xyz_m: [0.0, 0.0, 0.18]}
  frames:
    scan: {xyz_m: [0.0, 0.0, 0.2]}
    depth: {xyz_m: [0.06, 0.0, 0.3], rpy_rad: [0.0, 0.2, 0.0]}
    imu: {xyz_m: [0.0, 0.0, 0.06]}
    wheels: {xyz_m: [0.0, 0.0, 0.035]}

motion:
  space: planar
  can_reverse: true
  can_strafe: false
  min_turn_radius_m: 0.0
  collision_padding_m: 0.03
  limits:
    x: {velocity_mps: [-0.31, 0.31], accel_mps2: 0.6, decel_mps2: 1.0}
    y: {velocity_mps: [0.0, 0.0]}
    z: {velocity_mps: [0.0, 0.0]}
    yaw: {rate_radps: 1.9, accel_radps2: 3.0}

control:
  interface: velocity
  transport: ros2
  endpoint: /cmd_vel
  rate_hz: 20
  latency_s: 0.08
  controller_timeout_s: 0.5

failsafe:
  link_lost_after_s: 3.0
  on_link_lost: stop
  uncovered_motion: forbid

sensors:
  - id: scan
    kind: range_2d
    frame: scan
    source: {transport: ros2, endpoint: /scan}
    rate_hz: 7
    range_m: [0.15, 12.0]
    fov_deg: {h: 360, v: 1.0}
  - id: depth
    kind: depth
    frame: depth
    source: {transport: ros2, endpoint: /oakd/depth}
    rate_hz: 15
    range_m: [0.3, 8.0]
    fov_deg: {h: 80, v: 55}
  - id: imu
    kind: imu
    frame: imu
    source: {transport: ros2, endpoint: /imu}
    rate_hz: 100
  - id: wheel_odom
    kind: wheel_odom
    frame: wheels
    source: {transport: ros2, endpoint: /odom}
    rate_hz: 20


compute:
  board: vicharak_axon
  accelerator: rk3588_npu

assumptions:
  clear_at_start_m: 0.5
