# X500 class quadcopter: forward depth camera and a downward rangefinder, the usual PX4
# obstacle setup. The schema has no single-beam kind, so the rangefinder is a narrow depth
# sensor. Dimensions approximate.
argus_profile: 1
id: ref-x500-class
name: X500 class quadcopter

geometry:
  shapes:
    - type: box
      size_m: [0.16, 0.16, 0.1]
    # 10 inch propellers as thin discs at motor height.
    - {type: cylinder, radius_m: 0.127, length_m: 0.03, pose: {xyz_m: [0.177, 0.177, 0.06]}}
    - {type: cylinder, radius_m: 0.127, length_m: 0.03, pose: {xyz_m: [0.177, -0.177, 0.06]}}
    - {type: cylinder, radius_m: 0.127, length_m: 0.03, pose: {xyz_m: [-0.177, 0.177, 0.06]}}
    - {type: cylinder, radius_m: 0.127, length_m: 0.03, pose: {xyz_m: [-0.177, -0.177, 0.06]}}
  frames:
    depth: {xyz_m: [0.12, 0.0, -0.02]}
    down_range: {xyz_m: [0.0, 0.0, -0.06], rpy_rad: [0.0, 1.5708, 0.0]}
    imu: {xyz_m: [0.0, 0.0, 0.0]}

motion:
  space: aerial
  can_reverse: true
  can_strafe: true
  collision_padding_m: 0.1
  limits:
    x: {velocity_mps: [-2.0, 2.0], accel_mps2: 2.0, decel_mps2: 3.0}
    y: {velocity_mps: [-2.0, 2.0], accel_mps2: 2.0, decel_mps2: 3.0}
    z: {velocity_mps: [-1.0, 1.0], accel_mps2: 1.5, decel_mps2: 2.0}
    yaw: {rate_radps: 1.0, accel_radps2: 2.0}

control:
  interface: pose_setpoint
  transport: mavlink
  endpoint: udp://:14540
  rate_hz: 20
  latency_s: 0.05
  controller_timeout_s: 0.5

failsafe:
  link_lost_after_s: 2.0
  on_link_lost: hold
  uncovered_motion: forbid

sensors:
  - id: depth
    kind: depth
    frame: depth
    source: {transport: ros2, endpoint: /camera/depth/image_rect_raw}
    rate_hz: 30
    range_m: [0.3, 10.0]
    fov_deg: {h: 87, v: 58}
  - id: down_range
    kind: depth
    frame: down_range
    source: {transport: ros2, endpoint: /distance}
    rate_hz: 50
    range_m: [0.1, 12.0]
    fov_deg: {h: 5, v: 5}
  - id: imu
    kind: imu
    frame: imu
    source: {transport: mavlink, endpoint: udp://:14540}
    rate_hz: 100
  - id: flight_estimate
    kind: odometry
    frame: imu
    source: {transport: mavlink, endpoint: udp://:14540}
    rate_hz: 50


compute:
  board: vicharak_axon
  accelerator: rk3588_npu

assumptions:
  clear_at_start_m: 0.5
