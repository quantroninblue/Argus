# 1:10 scale car class (F1TENTH style): front-steered, 270 degree scanner on the nose.
# Speed limited to indoor use. Dimensions approximate.
argus_profile: 1
id: ref-f1tenth-class
name: 1:10 scale car class

geometry:
  ground_z_m: 0.0
  shapes:
    - type: box
      size_m: [0.58, 0.30, 0.17]
      pose: {xyz_m: [0.12, 0.0, 0.115]}
  frames:
    scan: {xyz_m: [0.33, 0.0, 0.14]}
    imu: {xyz_m: [0.1, 0.0, 0.1]}
    wheels: {xyz_m: [0.0, 0.0, 0.05]}

motion:
  space: planar
  can_reverse: true
  can_strafe: false
  min_turn_radius_m: 0.9
  collision_padding_m: 0.05
  limits:
    x: {velocity_mps: [-0.5, 1.5], accel_mps2: 1.5, decel_mps2: 2.5}
    y: {velocity_mps: [0.0, 0.0]}
    z: {velocity_mps: [0.0, 0.0]}
    yaw: {rate_radps: 1.6, accel_radps2: 4.0}

control:
  interface: velocity
  transport: ros2
  endpoint: /cmd_vel
  rate_hz: 40
  latency_s: 0.05
  controller_timeout_s: 0.2

failsafe:
  link_lost_after_s: 1.0
  on_link_lost: stop
  uncovered_motion: forbid

sensors:
  - id: scan
    kind: range_2d
    frame: scan
    source: {transport: ros2, endpoint: /scan}
    rate_hz: 40
    range_m: [0.06, 10.0]
    fov_deg: {h: 270, v: 1.0}
  - id: imu
    kind: imu
    frame: imu
    source: {transport: ros2, endpoint: /imu}
    rate_hz: 100
  - id: wheel_odom
    kind: wheel_odom
    frame: wheels
    source: {transport: ros2, endpoint: /odom}
    rate_hz: 50


compute:
  board: vicharak_axon
  accelerator: rk3588_npu

# A scanner below the top of the body: no overhangs, and nothing shorter than the scan
# plane, which the format states as obstacles at least as tall as the body.
assumptions:
  min_obstacle_height_m: 0.2
  clear_at_start_m: 0.5
