# Husky class: mid-size skid-steer base with a 2D scanner in the front bumper.
# Dimensions and limits approximate, from the public specification.
argus_profile: 1
id: ref-husky-class
name: Husky class

geometry:
  ground_z_m: 0.0
  shapes:
    - type: box
      size_m: [0.99, 0.67, 0.26]
      pose: {xyz_m: [0.0, 0.0, 0.26]}
  frames:
    scan: {xyz_m: [0.45, 0.0, 0.3]}
    imu: {xyz_m: [0.0, 0.0, 0.25]}
    wheels: {xyz_m: [0.0, 0.0, 0.165]}

motion:
  space: planar
  can_reverse: true
  can_strafe: false
  min_turn_radius_m: 0.0
  collision_padding_m: 0.05
  limits:
    x: {velocity_mps: [-0.5, 1.0], accel_mps2: 1.0, decel_mps2: 1.5}
    y: {velocity_mps: [0.0, 0.0]}
    z: {velocity_mps: [0.0, 0.0]}
    yaw: {rate_radps: 1.5, accel_radps2: 3.0}

control:
  interface: velocity
  transport: ros2
  endpoint: /cmd_vel
  rate_hz: 50
  latency_s: 0.08
  controller_timeout_s: 0.3

failsafe:
  link_lost_after_s: 3.0
  on_link_lost: stop
  uncovered_motion: forbid

sensors:
  - id: scan
    kind: range_2d
    frame: scan
    source: {transport: ros2, endpoint: /scan}
    rate_hz: 25
    range_m: [0.5, 20.0]
    fov_deg: {h: 270, v: 1.0}
  - id: imu
    kind: imu
    frame: imu
    source: {transport: ros2, endpoint: /imu/data}
    rate_hz: 100
  - id: wheel_odom
    kind: wheel_odom
    frame: wheels
    source: {transport: ros2, endpoint: /odom}
    rate_hz: 50


compute:
  board: vicharak_axon
  accelerator: rk3588_npu

# A scanner below the top of the body: no overhangs, and nothing shorter than the scan
# plane, which the format states as obstacles at least as tall as the body.
assumptions:
  min_obstacle_height_m: 0.4
  clear_at_start_m: 0.5
