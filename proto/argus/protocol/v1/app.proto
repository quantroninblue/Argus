// The hub's app interface: what the argus command (and later the GUI) uses to work with the
// hub. Served on a Unix socket in the hub's home directory that only the hub's owner can
// reach; robots use HubLink instead. Every call is made by a caller the hub identifies and
// authorises in one place, so accounts and remote clients can be added without changing
// these messages.

syntax = "proto3";

package argus.protocol.v1;

message StatusRequest {}

message HubStatus {
  string version = 1;
  string home = 2;            // the hub's home directory
  string robot_address = 3;   // where robots connect (HubLink), host:port
  double started_at = 4;      // Unix time
  uint32 robots_registered = 5;
  uint32 robots_connected = 6;
  string caller = 7;          // who the hub took this call to be from
}

message RobotsRequest {}

message RobotStatus {
  string node_id = 1;
  string profile_id = 2;
  string site_id = 3;
  bool connected = 4;
  double seconds_since_heard = 5;  // negative when never heard
  // Pose in the site frame, when the robot has reported one.
  bool has_pose = 6;
  double x = 7;
  double y = 8;
  double z = 9;
  string link = 10;     // connected, degraded, lost, unknown
  string mission = 11;  // idle, active, reached, failed, cancelled
  bool failsafe = 12;
  double evidence_demand_bytes_per_s = 13;
  double evidence_rate_bytes_per_s = 14;
  uint64 evidence_dropped = 15;
  string errand = 16;  // the route and stop the robot is on, empty without an errand
}

message RobotsReply {
  repeated RobotStatus robots = 1;
  double intake_capacity_bytes_per_s = 2;
  double intake_configured_bytes_per_s = 3;
}

message GoalRequest {
  string node_id = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  double tolerance_m = 5;  // 0 means the hub's default
}

message CancelRequest {
  string node_id = 1;
}

message Reply {
  bool ok = 1;
  string detail = 2;
}

message WatchRequest {}

// Something that changed on the hub. Kinds: robot_connected, robot_disconnected,
// link_changed, mission_changed, failsafe_changed; for validation jobs job_queued,
// run_started, run_finished, job_finished (with job_id set).
message HubEvent {
  double stamp = 1;  // Unix time
  string kind = 2;
  string node_id = 3;
  string detail = 4;
  string job_id = 5;
}

// A robot design: the user's URDF with its meshes, optional Gazebo model and answers file,
// gathered on the user's side (argus.hub.designs.collect) and sent whole, so the hub never
// reads the user's files directly.
message DesignFile {
  string path = 1;  // inside the design, e.g. robot.urdf or packages/my_robot/meshes/base.stl
  bytes data = 2;
}

message Finding {
  string severity = 1;  // error (cannot run), warning, note
  string where = 2;
  string text = 3;
}

message AddDesignRequest {
  string name = 1;
  repeated DesignFile files = 2;
  repeated Finding collect_findings = 3;  // problems found while gathering the files
}

message DesignVersion {
  string name = 1;
  string version = 2;  // hash of the design's files
  double created = 3;  // Unix time
  bool has_answers = 4;
  bool has_gazebo_model = 5;
  string profile_id = 6;  // empty when no profile could be built
  repeated Finding findings = 7;
  bool runnable = 8;      // no errors: the design may run in Gazebo
}

message AddDesignReply {
  bool ok = 1;
  string detail = 2;
  DesignVersion design = 3;
  bool added = 4;  // false when this exact version was already stored
}

message DesignsRequest {}

message DesignHistory {
  string name = 1;
  repeated DesignVersion versions = 2;  // oldest first
}

message DesignsReply {
  repeated DesignHistory designs = 1;
}

message DesignRequest {
  string name = 1;
  string version = 2;  // a prefix is enough; empty means the latest
}

message DesignReply {
  bool found = 1;
  string detail = 2;
  DesignVersion design = 3;
  string capability_report = 4;  // empty when no profile could be built
}

// Validation jobs: a stored design driven through Gazebo worlds, one run at a time, each run
// diagnosed from its log (argus.hub.validation). Gazebo runs without a window on the hub; the
// argus command attaches one to the live run on request, and plays finished runs back from
// the state Gazebo recorded.

message WorldsRequest {}

message WorldInfo {
  string name = 1;
  string description = 2;
}

message WorldsReply {
  repeated WorldInfo worlds = 1;
  repeated string contents = 2;  // what a world may hold: objects, movers, empty
}

message StartValidationRequest {
  string design = 1;
  string version = 2;            // a prefix is enough; empty means the latest
  repeated string worlds = 3;    // empty means every world
  repeated string contents = 4;  // empty means objects
  uint32 repeats = 5;            // 0 means 1
}

message RunFinding {
  string category = 1;  // design, argus, world, inconclusive
  string rule = 2;
  string sentence = 3;
  repeated string signals = 4;  // files or topics in the run log that show it
  bool has_time = 5;
  double from_s = 6;    // simulated time
  double to_s = 7;
}

message ValidationRun {
  uint32 index = 1;
  string name = 2;      // the run log's directory name
  string world = 3;
  string contents = 4;
  uint32 repeat = 5;
  string status = 6;    // queued, running, done, error, cancelled, interrupted
  string outcome = 7;   // reached, failed, collided
  string detail = 8;
  double started = 9;   // Unix time
  double finished = 10;
  double simulated_s = 11;
  repeated RunFinding findings = 12;
  string log_dir = 13;
  // While the run is live and its Gazebo is up: GZ_PARTITION, GZ_IP and GZ_SIM_RESOURCE_PATH,
  // what a Gazebo window needs to attach to it.
  map<string, string> attach = 14;
  bool has_replay = 15;       // Gazebo's recording of the run is in log_dir/replay
  string resource_path = 16;  // GZ_SIM_RESOURCE_PATH for playing it back
}

message JobReport {
  uint32 runs = 1;
  map<string, uint32> outcomes = 2;
  map<string, uint32> categories = 3;  // findings per category
  map<string, uint32> rules = 4;       // findings per rule
  repeated string argus_runs = 5;      // runs with an Argus finding
  uint32 unfinished = 6;
}

message Job {
  string id = 1;
  string design = 2;
  string version = 3;
  string profile_id = 4;
  string kind = 5;      // planar or aerial
  double created = 6;
  string status = 7;    // queued, running, done, cancelled
  repeated ValidationRun runs = 8;
  JobReport report = 9;
  bool kept = 10;       // never deleted to make room for new jobs
  uint64 size_bytes = 11;
}

message StartValidationReply {
  bool ok = 1;
  string detail = 2;
  Job job = 3;
}

message JobsRequest {}

message JobsReply {
  repeated Job jobs = 1;  // oldest first
}

message JobRequest {
  string id = 1;  // a prefix is enough
}

message JobReply {
  bool found = 1;
  string detail = 2;
  Job job = 3;
}

message KeepJobRequest {
  string id = 1;
  bool keep = 2;  // false lets the job be deleted to make room again
}

// Named places and routes per site (argus.hub.places), and errands that run a robot along a
// route (argus.hub.errand). A plain goal or a cancel ends a robot's errand.

message PlaceInfo {
  string name = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  double tolerance_m = 5;  // 0 means the default
  bool has_heading = 6;
  double heading_rad = 7;
}

message AddPlaceRequest {
  string site = 1;
  PlaceInfo place = 2;
  bool replace = 3;  // replace a place of the same name
}

message PlaceHereRequest {
  string node_id = 1;   // the place is where this robot is now, in its site
  string name = 2;
  double tolerance_m = 3;
  bool with_heading = 4;
  bool replace = 5;
}

message SiteRequest {
  string site = 1;  // empty means every site
}

message SitePlaces {
  string site = 1;
  repeated PlaceInfo places = 2;
}

message PlacesReply {
  repeated SitePlaces sites = 1;
}

message RemoveRequest {
  string site = 1;
  string name = 2;
}

message RouteStop {
  string place = 1;
  double dwell_s = 2;
}

message RouteInfo {
  string name = 1;
  repeated RouteStop stops = 2;
  string mode = 3;            // once, loop, back_and_forth
  string on_unreachable = 4;  // skip, stop
  uint32 cycles = 5;          // 0 means until cancelled (loop, back_and_forth)
}

message AddRouteRequest {
  string site = 1;
  RouteInfo route = 2;
  bool replace = 3;
}

message SiteRoutes {
  string site = 1;
  repeated RouteInfo routes = 2;
}

message RoutesReply {
  repeated SiteRoutes sites = 1;
}

message GoRequest {
  string node_id = 1;
  string place = 2;  // a place in the robot's site
}

message PatrolRequest {
  string node_id = 1;
  string route = 2;  // a route in the robot's site
}

// Model connections and slots. A key goes up once and is never sent back or written to disk.
message ConnectModelRequest {
  string name = 1;
  string kind = 2;      // openai-compatible, anthropic, claude-code
  string base_url = 3;  // empty for the provider's own address
  string key = 4;
}

// ChatGPT sign-in happens in the person's browser against a listener on the hub, so that tokens
// never cross this interface.
message SignInRequest {
  string name = 1;
}

message SignInReply {
  bool ok = 1;
  string detail = 2;
  string url = 3;  // to open in a browser
}

message ModelsRequest {}

message ModelConnection {
  string name = 1;
  string kind = 2;
  string base_url = 3;
  bool remote = 4;      // data sent to it leaves this machine
  bool needs_key = 5;   // the hub restarted; connect again with the key or sign in again
  repeated string models = 6;
}

message ModelSlot {
  string slot = 1;
  string connection = 2;  // empty when nothing fills the slot
  string model = 3;
}

message ModelsReply {
  repeated ModelConnection connections = 1;
  repeated ModelSlot slots = 2;
}

message UseModelRequest {
  string slot = 1;
  string connection = 2;
  string model = 3;
}

message DisconnectModelRequest { string name = 1; }

message TestModelRequest {
  string slot = 1;
  bytes image = 2;
  string media_type = 3;
}

// What a model said. `model` is empty when no model was used and `text` is the rule-based tier.
message ModelTextReply {
  bool ok = 1;
  string detail = 2;
  string text = 3;
  string model = 4;
}

message ExplainRequest {
  string job = 1;
  uint32 run = 2;  // 0 for the whole job
  string question = 3;
}

message ReviewDesignRequest {
  string name = 1;
  string version = 2;
  string question = 3;
}

message CompareJobsRequest {
  string a = 1;
  string b = 2;
}

message InterpretGoalRequest {
  string node_id = 1;
  string text = 2;
}

// What an instruction in words means here. Nothing moves until the caller sends Go or Patrol.
message InterpretGoalReply {
  bool ok = 1;
  string detail = 2;
  string kind = 3;  // place, route, or unclear
  string name = 4;
  string model = 5;
}

service HubApp {
  rpc Status(StatusRequest) returns (HubStatus);
  rpc Robots(RobotsRequest) returns (RobotsReply);
  rpc SetGoal(GoalRequest) returns (Reply);
  rpc Cancel(CancelRequest) returns (Reply);
  // Events as they happen, until the caller hangs up.
  rpc Watch(WatchRequest) returns (stream HubEvent);
  rpc AddDesign(AddDesignRequest) returns (AddDesignReply);
  rpc Designs(DesignsRequest) returns (DesignsReply);
  rpc Design(DesignRequest) returns (DesignReply);
  rpc Worlds(WorldsRequest) returns (WorldsReply);
  rpc StartValidation(StartValidationRequest) returns (StartValidationReply);
  rpc Jobs(JobsRequest) returns (JobsReply);
  rpc Job(JobRequest) returns (JobReply);
  rpc CancelJob(JobRequest) returns (Reply);
  rpc KeepJob(KeepJobRequest) returns (Reply);
  rpc DeleteJob(JobRequest) returns (Reply);
  rpc AddPlace(AddPlaceRequest) returns (Reply);
  rpc PlaceHere(PlaceHereRequest) returns (Reply);
  rpc Places(SiteRequest) returns (PlacesReply);
  rpc RemovePlace(RemoveRequest) returns (Reply);
  rpc AddRoute(AddRouteRequest) returns (Reply);
  rpc Routes(SiteRequest) returns (RoutesReply);
  rpc RemoveRoute(RemoveRequest) returns (Reply);
  rpc Go(GoRequest) returns (Reply);
  rpc Patrol(PatrolRequest) returns (Reply);
  rpc ConnectModel(ConnectModelRequest) returns (Reply);
  rpc BeginSignIn(SignInRequest) returns (SignInReply);
  rpc FinishSignIn(SignInRequest) returns (Reply);
  rpc Models(ModelsRequest) returns (ModelsReply);
  rpc UseModel(UseModelRequest) returns (Reply);
  rpc DisconnectModel(DisconnectModelRequest) returns (Reply);
  rpc TestModel(TestModelRequest) returns (ModelTextReply);
  rpc Explain(ExplainRequest) returns (ModelTextReply);
  rpc ReviewDesign(ReviewDesignRequest) returns (ModelTextReply);
  rpc CompareJobs(CompareJobsRequest) returns (ModelTextReply);
  rpc InterpretGoal(InterpretGoalRequest) returns (InterpretGoalReply);
}
