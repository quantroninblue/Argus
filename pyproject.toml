[project]
name = "argus"
version = "0.1.0"
description = "Body-agnostic navigation for robots"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyyaml>=6", "jsonschema>=4.10", "protobuf>=4.21", "pyjwt[crypto]>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Noise from the system protobuf package on Python 3.12, not from our code.
filterwarnings = [
    "ignore:.*PyType_Spec.*:DeprecationWarning",
    "ignore:.*utcfromtimestamp.*:DeprecationWarning",
]
